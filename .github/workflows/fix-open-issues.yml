name: Apply open issue fixes

on:
  push:
    branches:
      - fix/all-open-issues-20260908

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[issue-fixes-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/all-open-issues-20260908
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply source patches
        run: |
          python tools/fix_open_issues.py
          python tools/fix_open_issues_followup.py
      - name: Build and run regression suites
        shell: cmd
        run: build-msvc.bat
      - name: Commit verified fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/fix_open_issues.py tools/fix_open_issues_followup.py .github/workflows/fix-open-issues.yml
          git add -A
          git commit -m "fix: resolve combat and campaign UX issues [issue-fixes-applied]"
          git push origin HEAD:fix/all-open-issues-20260908
