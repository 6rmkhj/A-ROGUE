name: Count source lines

on:
  push:
    branches:
      - fix/all-open-issues-20260908

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count current source lines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src')
          files = sorted(p for p in src.iterdir() if p.is_file() and p.suffix.lower() in {'.cpp', '.h', '.rc'})
          runtime_excluded = {'balance.cpp', 'curve.cpp', 'smoke.cpp', 'wav.cpp'}
          def stats(paths):
              physical = nonblank = 0
              for p in paths:
                  lines = p.read_text(encoding='utf-8', errors='replace').splitlines()
                  physical += len(lines)
                  nonblank += sum(bool(line.strip()) for line in lines)
              return physical, nonblank
          total_physical, total_nonblank = stats(files)
          runtime = [p for p in files if p.name not in runtime_excluded]
          runtime_physical, runtime_nonblank = stats(runtime)
          print(f'SRC_FILES={len(files)}')
          print(f'SRC_LINES={total_physical}')
          print(f'SRC_NONBLANK={total_nonblank}')
          print(f'RUNTIME_FILES={len(runtime)}')
          print(f'RUNTIME_LINES={runtime_physical}')
          print(f'RUNTIME_NONBLANK={runtime_nonblank}')
          print('PER_FILE_BEGIN')
          for p in files:
              lines = p.read_text(encoding='utf-8', errors='replace').splitlines()
              print(f'{len(lines):6d} {p.as_posix()}')
          print('PER_FILE_END')
          PY
