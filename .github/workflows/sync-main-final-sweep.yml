name: Sync main for final issue sweep

on:
  push:
    branches:
      - fix/all-open-issues-20260908

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/all-open-issues-20260908
      - name: Merge latest main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -X ours
      - name: Build and run regression suites
        shell: cmd
        run: build-msvc.bat
      - name: Commit verified sync
        shell: pwsh
        run: |
          git rm .github/workflows/sync-main-final-sweep.yml
          git add -A
          git commit -m "chore: sync latest main before final issue sweep"
          git push origin HEAD:fix/all-open-issues-20260908
